<!doctype html>
<!-- Social card source. Rasterize at 1200x630 to og.png after any brand or message change:
     open this file in Chromium at viewport 1200x630, wait for fonts, screenshot the viewport. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; }
  body { width: 1200px; height: 630px; background: #F3F0ED; color: #2B2C2E; font: 400 20px/1.5 Inter, sans-serif; padding: 64px 72px; display: flex; flex-direction: column; }
  .mark { display: flex; align-items: center; gap: 18px; }
  .mark img { height: 44px; width: auto; display: block; }
  .mark .product { font: 600 22px/1 "DM Sans", sans-serif; letter-spacing: -.01em; border-left: 1px solid #CFC9BE; padding-left: 18px; }
  h1 { font: 700 64px/1.06 "DM Sans", sans-serif; letter-spacing: -.03em; margin: auto 0 18px; max-width: 20ch; }
  h1 span { color: #3D8B04; }
  .sub { font-size: 24px; color: #5A5C5E; max-width: 46ch; }
  .foot { display: flex; justify-content: space-between; align-items: baseline; border-top: 1px solid #CFC9BE; margin-top: 40px; padding-top: 22px; font: 500 15px/1.6 "IBM Plex Mono", monospace; letter-spacing: .12em; text-transform: uppercase; color: #5A5C5E; }
  .foot b { font-weight: 500; color: #3D8B04; }
</style>
</head>
<body>
  <div class="mark"><img src="assets/logo-black.png" alt="Grownetics"><span class="product">Site Evaluator</span></div>
  <h1>CEA Psychrometric Site Evaluator<span>.</span></h1>
  <p class="sub">Climate, control and cost, with the assumptions in view.</p>
  <div class="foot"><span><b>Open source</b> · Model 0.3.0-screening</span><span>Assumption-based screen, not a calibrated digital twin</span></div>
</body>
</html>
