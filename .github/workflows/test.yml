name: tests

# The repository has no runtime or build dependencies, so there is nothing to install:
# npm test is node --test over test/*.test.mjs.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run the regression suite
        run: npm test
