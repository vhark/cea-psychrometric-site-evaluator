name: tests

# Zero runtime dependencies; Playwright is used only for browser verification.

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install test-only browser runner
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run the regression suite
        run: npm test

      - name: Verify browser workflows at root and deployed subpath
        run: npm run test:browser

      # Reports bundled dataset ages. It exits 1 when a dataset is past its staleness budget,
      # which is a maintenance signal, not a broken build, so it never fails the run.
      - name: data vintages
        run: node scripts/check-vintages.mjs || true
