name: tests

# The repository has no runtime or build dependencies, so there is nothing to install:
# npm test is node --test over test/*.test.mjs.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run the regression suite
        run: npm test

      # Reports bundled dataset ages. It exits 1 when a dataset is past its staleness budget,
      # which is a maintenance signal, not a broken build, so it never fails the run.
      - name: data vintages
        run: node scripts/check-vintages.mjs || true
